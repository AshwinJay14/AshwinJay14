name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AshwinJay14
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563EB&color_dots=#E2E8F0,#BFDBFE,#93C5FD,#60A5FA,#2563EB
            dist/github-contribution-grid-snake-dark.svg?color_snake=#60A5FA&color_dots=#0F172A,#172554,#1D4ED8,#3B82F6,#93C5FD
      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
